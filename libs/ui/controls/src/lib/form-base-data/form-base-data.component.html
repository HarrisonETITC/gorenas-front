<div class="w-full h-full flex flex-col text-white py-4 px-1">
    <button
        (click)="goBack()"
        class="bg-action hover:bg-actionHover transition-[background-color] duration-300 text-white mat-icon-button"
        matTooltip="Regresar a la página anterior"
        mat-icon-button>
        <mat-icon>arrow_back_outline</mat-icon>
    </button>
    <div class="flex flex-col max-w-xl max-h-[calc(100vh-10rem)] bg-secondary ml-auto mr-auto rounded-general overflow-hidden">
        <h3 class="text-white text-left w-full py-4 px-5 text-xl font-bold bg-secondary">{{ getFormTitle() }}</h3>
        <div class="overflow-y-auto px-5 form-container">
            @if (fieldsToDisplay.length > 0) {
            <app-form-base class="bg-secondary w-full"
                [mode]="'form'"
                [fields]="fieldsToDisplay"
                [automaticUpdate]="true"
                [transparentFields]="true"
            ></app-form-base>
            }
        </div>
        <div class="flex justify-end w-full bg-secondary py-3 px-5">
            <button
                class="header-button button-icon-right-fix"
                (click)="handleFormMainButton()">
                {{ getButtonTitle() }}
                <mat-icon>check_small</mat-icon>
            </button>
        </div>
    </div>
</div>
