<div class="p-4 bg-primary h-screen flex flex-col">
    <div class="flex items-center justify-between p-1">
        <h1 class="text-contentMain text-2xl leading-8 m-0">{{ pageConfig.pageName }}</h1>
    </div>
    @if(!(isFormView$ | async)) {
        <div class="flex flex-col h-full">
            <div class="flex items-center py-4 px-1"
                [ngClass]="{ 'justify-end': filterExtended, 'justify-between': !filterExtended }">
                @if (!filterExtended) {
                    <app-filters-compact class="compact"
                        [fields]="filters"
                        (searchHandler)="handleSearch($event)"
                    ></app-filters-compact>
                }
                <div class="flex flex-col items-end justify-center">
                    <div>
                        <button
                            [matMenuTriggerFor]="settings"
                            mat-icon-button>
                            <mat-icon>settings_outline</mat-icon>
                        </button>
                        <mat-menu #settings="matMenu">
                            <p class="text-white flex flex-col p-2 pl-4 h-full relative before:content-dot before:absolute before:text-white before:left-1 before:text-xl before:top-1">
                                Modo de filtros: {{ filterExtended? 'Extendido' : 'Compacto' }}
                                <mat-slide-toggle
                                    (click)="$event.stopPropagation()"
                                    (change)="filterExtended = !filterExtended;"
                                    [checked]="filterExtended"
                                ></mat-slide-toggle>
                            </p>
                        </mat-menu>
                    </div>
                    @if(!verifyEmpty(dataForms)) {
                        <button class="bg-action hover:bg-actionHover text-white text-sm leading-6 border-none rounded h-8 px-4 transition-all duration-200 cursor-pointer flex items-center"
                            (click)="goCreate()">
                            {{ pageConfig.createButtonLabel }}
                            <mat-icon
                                class="text-white p-0 ml-2"
                            >add_outline</mat-icon>
                        </button>
                    }
                </div>
            </div>
            <div class="flex justify-center gap-1 h-full">
                @if(filterExtended) {
                    <app-filters-extended 
                        [fields]="filters"
                        (searchHandler)="handleSearch($event)"
                    ></app-filters-extended>
                }
                <app-table
                    class="w-full h-full"
                    [dataNotifier$]="data$"
                    [headersMap]="headers"
                    [generalConfig]="tableConfig"
                    (onBtnClick)="handleBtnAction($event)"
                ></app-table>
            </div>
        </div>
    }
    @else {
        <div>
            <router-outlet></router-outlet>
        </div>
    }
</div>
